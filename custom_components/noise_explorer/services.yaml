              "setps_setting",
              "setps_notification",
              "white_list_on",
              "CloudPhotos",
              "fcm_onoff",
              "report_fault_onoff",
              "keep_wifi_connect",
              "auto_connect_wifi",
              "fota_wifi_only",
              "operation_mode_value",
              "volume_level",
              "led_level",
              "volumevibrate",
              "auto_answer",
              "steps_target_level"
            ]
          }
        }
      },
      "value": {
        "name": "Value",
        "required": true,
        "selector": {
          "text": {}
        }
      }
    }
  },
  "get_settings": {
    "name": "Read watch settings",
