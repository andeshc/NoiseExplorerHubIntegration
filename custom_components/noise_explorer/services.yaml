  "set_setting": {
    "name": "Set watch setting",
    "description": "Set a supported setting using its documented wire value; see README. Prefer switch/select/number entities for normal use.",
    "fields": {
      "device_id": {
        "name": "Watch",
        "required": true,
        "selector": {
          "device": {
            "integration": "noise_explorer"
          }
        }
      },
      "key": {
        "name": "Setting",
